project:
  name: "The Spectral Eclipse Frontier: Complete Lean 4 Resolution of Conjecture 4.1, Sharp Even/Odd Rupture Thresholds, Universal 3R+2 Phase Transitions, Complex Staggered-Field Exclusion, and Quantum Speed Limits"
  description: >-
    Lean 4.35.0 / Mathlib v4.35.0 formalization of a 10-theorem chain on Early State
    Exclusion (ESE) in 1D quantum spin chains with Perfect State Transfer (PST),
    anchored in Escobar, Garcia, and Minenkova (arXiv:2507.18767v1). Across 12
    isolated Mathlib-only Palomar Comparator targets (572 exhaustively audited
    theorems, 18 NonVacuity witnesses, 5 AdversarialTests refutations): (1) complete
    dichotomies for 4x4, 5x5, and 6x6 symmetric PST chains plus universal even
    converse (Theorems 1-3); (2) complete resolution of Conjecture 4.1 (7x7 symmetric
    PST chains) in both reduced integer and arbitrary real-scaled unreduced forms
    (Theorem 4); (3) sharp even rupture threshold N_crit^even = 8 (Theorem 5);
    (4) Critical 9x9 No-ESE Theorem for all 1 < b < c < d via 19 exact bivariate
    Bernstein certificates (Theorem 6); (5) sharp odd rupture 11x11 threshold M* = 12
    via 5 rational SOS certificates (Theorem 7); (6) universal (R, r) Krawtchouk-core
    vs. spectral-cluster phase transition at N_crit(R) = 3R + 2 (Theorem 8); (7) first
    infinite non-symmetric staggered-field 5x5 complex-amplitude ESE family J_{a,b}
    with literal matrix eigenpairs, Schrodinger ODE fidelity, PST at pi, and complex
    ESE at pi/3 (Theorem 9); and (8) exact Jacobi Fubini-Study metric g_tt = b_0^2,
    Mandelstam-Tamm ESE speed limit tau >= pi/(2*sigma), and ESE-ETE time-reversal
    duality (Theorem 10).
  authors:
    - name: "Alexander S. Donahue"
      orcid: "0009-0006-8168-9648"
      email: "0_0@0thernes.art"
      affiliation: "Independent Researcher, Spokane, WA, USA"
