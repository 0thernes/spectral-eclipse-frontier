name: Lean 4.35.0 Formal Verification & Six-Kernel Comparator Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lean-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  lean-verify:
    name: Build, Axiom Audit, Negative Gate & Comparator (6 Checker Runs)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install elan & Lean 4.35.0
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install bubblewrap for sandboxed lake comparator
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Fetch pinned Mathlib cache & build SpectralEclipse, Challenge, Solution, VerifyAxioms
        working-directory: lean
        run: |
          lake exe cache get
          lake build SpectralEclipse Challenge Solution VerifyAxioms
      - name: Forbidden-token scan (nested-comment & string-aware Lean lexer)
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          def strip_lean_comments(src: str) -> str:
              out, i, n, depth, in_str = [], 0, len(src), 0, False
              while i < n:
                  if depth > 0:
                      if src[i:i+2] == "/-":
                          depth += 1; i += 2
                      elif src[i:i+2] == "-/":
                          depth -= 1; i += 2
                      else:
                          if src[i] == "\n": out.append("\n")
                          i += 1
                  elif in_str:
                      if src[i] == "\\" and i + 1 < n:
                          i += 2
                      elif src[i] == '"':
                          in_str = False; i += 1
                      else:
                          if src[i] == "\n": out.append("\n")
                          i += 1
                  else:
                      if src[i:i+2] == "/-":
                          depth = 1; i += 2
                      elif src[i:i+2] == "--":
                          while i < n and src[i] != "\n": i += 1
                      elif src[i] == '"':
                          in_str = True; i += 1
                      else:
                          out.append(src[i]); i += 1
              return "".join(out)

          forbidden = re.compile(
              r"\b(sorry|admit|native_decide|unsafe)\b|^\s*(?:@\[[^\]]+\]\s+|public\s+|private\s+|protected\s+|noncomputable\s+)*axiom\b|^\s*(?:public\s+|private\s+|protected\s+)*partial\s+(?:def|theorem)\b|implemented_by|@\[extern"
          )
          roots = [
              Path("lean/SpectralEclipse"),
              Path("lean/SpectralEclipse.lean"),
              Path("lean/Solution.lean"),
          ]
          hits = []
          for item in roots:
              files = [item] if item.is_file() else sorted(item.rglob("*.lean"))
              for f in files:
                  cleaned = strip_lean_comments(f.read_text(encoding="utf-8"))
                  if not re.search(r"^\s*module\s*$", cleaned, re.M):
                      hits.append(f"{f}:1: missing required Lean 4.35 module header")
                  for lineno, line in enumerate(cleaned.splitlines(), 1):
                      if forbidden.search(line):
                          hits.append(f"{f}:{lineno}: {line.strip()}")
          if hits:
              print("Forbidden Lean token detected:", file=sys.stderr)
              for h in hits:
                  print(" ", h, file=sys.stderr)
              sys.exit(1)
          print("PASS: 0 forbidden Lean tokens across all proof modules.")
          PY
      - name: Run exhaustive #print axioms audit (VerifyAxioms.lean)
        working-directory: lean
        shell: bash
        run: |
          set -o pipefail
          lake env lean VerifyAxioms.lean | tee ../results/lean-axioms-ci.log
      - name: Verify live CI axiom log & committed README sync
        run: |
          python3 scripts/check_readme_axioms.py --log results/lean-axioms-ci.log --require-exhaustive
          python3 scripts/check_readme_axioms.py --log results/lean-axioms-all.log --require-exhaustive
      - name: Run Batteries linter (strict zero-error gate on SpectralEclipse & Solution)
        working-directory: lean
        run: lake exe runLinter SpectralEclipse Solution
      - name: Run live negative kernel elaboration gate (3 mutated false theorems must fail)
        run: python3 scripts/test_lean_negative.py
      - name: Run sandboxed lake comparator --paranoid (six independent checker runs)
        working-directory: lean
        shell: bash
        run: |
          set -o pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          lake comparator --config comparator.json --paranoid | tee ../results/comparator-paranoid-ci.log
      - name: Live tamper-injecting negative comparator gate (forged Solution.lean must be rejected)
        working-directory: lean
        shell: bash
        run: |
          cp Solution.lean /tmp/Solution.lean.bak
          trap 'mv -f /tmp/Solution.lean.bak Solution.lean && lake build Solution' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Solution.lean")
          src = p.read_text(encoding="utf-8")
          old = "  SpectralEclipse.dichotomy_4x4 hp_odd hq_odd hpq hgap"
          assert old in src, "Expected target body not found in Solution.lean"
          p.write_text(src.replace(old, "  sorry", 1), encoding="utf-8")
          PY
          if lake comparator --config comparator.json; then
            echo "ERROR: lake comparator unexpectedly accepted a sorry-tampered Solution.lean!" >&2
            exit 1
          fi
          echo "PASS: lake comparator rejected sorry-tampered Solution.lean as expected."
      - name: Upload Lean CI verification logs
        uses: actions/upload-artifact@v4
        with:
          name: lean-six-kernel-logs
          path: |
            results/lean-axioms-ci.log
            results/comparator-paranoid-ci.log
      - name: Attest Lean axiom & comparator reports (SLSA / Sigstore)
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: |
            results/lean-axioms-ci.log
            results/comparator-paranoid-ci.log
