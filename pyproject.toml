[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-eclipse-frontier"
version = "1.1.0"
description = "Sharp Dimension Thresholds, Non-Symmetric Complex Eclipses, and Quantum Speed Limits for Early State Exclusion in Persymmetric PST Spin Chains"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Alexander Stephen Donahue", email = "0_0@0thernes.art"}]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.12",
    "mpmath>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.90",
    "matplotlib>=3.8",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
